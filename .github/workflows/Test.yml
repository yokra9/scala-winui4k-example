name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: "windows-2025"

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'sbt'

    - name: Install the latest Windows App SDK Runtime
      uses: enda-mullally/Install-WindowsAppSDKRuntime@v1.1
      with:
        experimental: false

    - name: Build fat JAR
      run: sbt assembly

    - name: Run GUI smoke test
      shell: pwsh
      run: |
        $proc = Start-Process java -ArgumentList "-jar", "scala-winui4k-example-assembly.jar" -RedirectStandardOutput 'out.log' -RedirectStandardError 'err.log' -PassThru

        # アプリが起動するまで待機
        Start-Sleep -Seconds 5

        if ($proc.HasExited) {
          Write-Host "Process exited early with code $($proc.ExitCode)"
          Write-Host "=== stdout ==="
          Get-Content 'out.log'
          Write-Host "=== stderr ==="
          Get-Content 'err.log'
          exit $proc.ExitCode
        }

        # 10秒間生存確認
        Start-Sleep -Seconds 10
        $alive = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
        if (-not $alive) {
          Write-Host "App process exited before 10 seconds"
          Write-Host "=== stdout ==="
          Get-Content 'out.log'
          Write-Host "=== stderr ==="
          Get-Content 'err.log'
          exit 1
        }

        Write-Host "App process stayed up for 10 seconds"
        Stop-Process -Id $proc.Id -Force

        Write-Host "=== stdout ==="
        Get-Content 'out.log'

        Write-Host "=== stderr ==="
        Get-Content 'err.log'
